name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check tests
      - run: uv run ruff format --check tests
      # Includes the gate tests: each flavor is generated and run through its own scripts/check.sh.
      - run: uv run pytest
