[project]
name = "python-scaffolding"
version = "0.1.0"
description = "Copier template for Python projects: library/CLI, FastAPI service, data science."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "copier>=9.4",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
]

# This repo is a template, not an installable package: `uv sync` only installs the dev tools.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gate: slow; generates a project, installs its dependencies and runs its scripts/check.sh",
    "update: generates a project, evolves the template, and checks `copier update`",
]
filterwarnings = [
    # Copier warns when the template repo has uncommitted changes (normal while developing).
    "ignore::copier.errors.DirtyLocalWarning",
]
